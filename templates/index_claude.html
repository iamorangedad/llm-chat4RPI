<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>树莓派 LLM 助手 - Qwen3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-content {
            max-width: 75%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .thinking-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            color: #856404;
            margin-bottom: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .thinking-header {
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .thinking-content {
            line-height: 1.6;
            white-space: pre-wrap;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .response-box {
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .message.user .response-box {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .response-box {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        #userInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        #userInput:focus {
            border-color: #667eea;
        }

        #sendBtn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #sendBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #667eea;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toggle-thinking {
            cursor: pointer;
            user-select: none;
            font-size: 12px;
            color: #856404;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .toggle-thinking:hover {
            opacity: 1;
        }

        .thinking-content.collapsed {
            max-height: 60px;
            overflow: hidden;
            position: relative;
        }

        .thinking-content.collapsed::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(transparent, #fff3cd);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🤖 树莓派 LLM 助手 - Qwen3</h1>
            <div style="font-size: 14px; margin-top: 5px; opacity: 0.9;">
                基于 Ollama + FastAPI | 支持思考过程显示
            </div>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message assistant">
                <div class="message-content">
                    <div class="response-box">
                        你好！我是运行在树莓派上的Qwen3 AI助手。我会展示我的思考过程，让你了解我是如何得出答案的。有什么我可以帮助你的吗？
                    </div>
                </div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="输入你的问题..."
                onkeypress="if(event.key==='Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(content, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            if (isUser) {
                const responseBox = document.createElement('div');
                responseBox.className = 'response-box';
                responseBox.textContent = content;
                contentDiv.appendChild(responseBox);
            } else {
                // 为助手消息创建思考框和响应框
                const thinkingBox = document.createElement('div');
                thinkingBox.className = 'thinking-box';
                thinkingBox.style.display = 'none'; // 初始隐藏

                const thinkingHeader = document.createElement('div');
                thinkingHeader.className = 'thinking-header';
                thinkingHeader.innerHTML = '💭 思考过程 <span class="toggle-thinking" onclick="toggleThinking(this)">[展开/收起]</span>';

                const thinkingContent = document.createElement('div');
                thinkingContent.className = 'thinking-content';

                thinkingBox.appendChild(thinkingHeader);
                thinkingBox.appendChild(thinkingContent);

                const responseBox = document.createElement('div');
                responseBox.className = 'response-box';

                contentDiv.appendChild(thinkingBox);
                contentDiv.appendChild(responseBox);
            }

            messageDiv.appendChild(contentDiv);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            return contentDiv;
        }

        function toggleThinking(element) {
            const thinkingContent = element.closest('.thinking-box').querySelector('.thinking-content');
            thinkingContent.classList.toggle('collapsed');
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // 添加用户消息
            addMessage(message, true);
            userInput.value = '';
            sendBtn.disabled = true;

            // 创建助手消息占位符
            const assistantDiv = addMessage('', false);
            const thinkingBox = assistantDiv.querySelector('.thinking-box');
            const thinkingContent = assistantDiv.querySelector('.thinking-content');
            const responseBox = assistantDiv.querySelector('.response-box');

            responseBox.innerHTML = '<span class="loading"></span>';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        stream: true
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullThinking = '';
                let fullResponse = '';
                let hasThinking = false;

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;

                            try {
                                const json = JSON.parse(data);

                                // 处理思考内容
                                if (json.thinking) {
                                    fullThinking += json.thinking;
                                    thinkingContent.textContent = fullThinking;
                                    if (!hasThinking) {
                                        thinkingBox.style.display = 'block';
                                        hasThinking = true;
                                    }
                                }

                                // 处理响应内容
                                if (json.response) {
                                    fullResponse += json.response;
                                    responseBox.textContent = fullResponse;
                                }

                                chatBox.scrollTop = chatBox.scrollHeight;
                            } catch (e) {
                                console.error('解析错误:', e);
                            }
                        }
                    }
                }

                if (!fullResponse) {
                    responseBox.textContent = '抱歉，我没有收到回复。';
                }

                // 如果思考内容较长，初始折叠
                if (fullThinking.length > 200) {
                    thinkingContent.classList.add('collapsed');
                }

            } catch (error) {
                console.error('错误:', error);
                responseBox.textContent = '抱歉，发生了错误：' + error.message;
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }
    </script>
</body>

</html>
